name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pkg = "$env:GITHUB_WORKSPACE\package\Devrimism-Win"
          $exe = "$env:GITHUB_WORKSPACE\build\Release\Devrimism.exe"

          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $pkg -ItemType Directory -Force | Out-Null
          Copy-Item $exe $pkg

          windeployqt `
            --release `
            --no-translations `
            --compiler-runtime `
            "$pkg\Devrimism.exe"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\DevrimismWeb" `
            "$pkg\DevrimismWeb" `
            -Recurse -Force

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "package\Devrimism-Win\*" `
            -DestinationPath "Devrimism-Win.zip" `
            -CompressionLevel Optimal `
            -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Devrimism-Windows
          path: Devrimism-Win.zip
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Devrimism-Win.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
